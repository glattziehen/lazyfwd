version: 2

project_name: lazyfwd

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # lazyfwd hard-codes its version in version.go, so no -X flags.
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    # Windows users open zip archives without extra tools.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# The Publish workflow passes the tag's CHANGELOG.md section as the release notes.
changelog:
  disable: true

release:
  # A rerun replaces the assets an earlier run uploaded.
  replace_existing_artifacts: true
