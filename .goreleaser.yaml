version: 2

project_name: lazyfwd

before:
  hooks:
    - ./scripts/third-party-licenses.sh

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # lazyfwd embeds its version from VERSION, so no -X flags.
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    # Windows users open zip archives without extra tools.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      # Only the licenses of what this OS's binary links.
      - src: "third_party_licenses/{{ .Os }}/**/*"
        dst: third_party_licenses

checksum:
  name_template: checksums.txt

# The Publish workflow passes the tag's CHANGELOG.md section with --release-notes. The changelog
# stays enabled: goreleaser reads --release-notes in its changelog step, so disabling it drops them.
release:
  # A rerun replaces the assets an earlier run uploaded.
  replace_existing_artifacts: true

# A local snapshot carries VERSION's number, as a release does, instead of a commit hash.
snapshot:
  version_template: '{{ readFile "VERSION" | trim }}'
